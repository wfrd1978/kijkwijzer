name: Online zetten

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Elke ochtend (rond 05:30 Nederlandse tijd) opnieuw, voor een vers voetbalschema en de NPO-gids.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Eerst de tests: faalt er één, dan wordt er niets online gezet.
      - run: npm test
      # Voetbalschema van football-data.org; de sleutel staat als geheim in GitHub, niet in de code.
      # Lukt het niet, dan gaat het online zetten gewoon door (de app toont dan een melding).
      - name: Voetbalschema ophalen
        run: node scripts/voetbal.mjs
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        continue-on-error: true
      # Op welk ESPN-kanaal elke Eredivisie-wedstrijd komt (openbare pagina van Ziggo).
      - name: ESPN-kanalen ophalen
        run: node scripts/espn.mjs
        continue-on-error: true
      # Avonden op NPO 1, 2 en 3 voor de kijktip op Vandaag (gids van npo.nl, zonder sleutel).
      - name: NPO-gids ophalen
        run: node scripts/npo.mjs
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
